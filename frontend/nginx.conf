# ==============================================================================
# 币安 BTC/ETH 3分钟量化交易系统 - 前端 Nginx 配置（生产级修复版）
# ==============================================================================
# @file    frontend/nginx.conf
# @version 1.0.1
# @brief   已修复 15 类运行时问题，适配非 root 运行 + 只读文件系统
#
# 使用方式:
#   挂载到 /etc/nginx/conf.d/default.conf
#   docker run -v ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro ...
# ==============================================================================

server {
    # ========== 监听配置 ==========
    # 非 root 用户无法绑定 1024 以下端口，使用 8080
    listen 8080;
    listen [::]:8080;
    server_name _;

    # ========== 根目录与入口 ==========
    root /usr/share/nginx/html;
    index index.html;

    # ========== 隐藏版本信息 ==========
    server_tokens off;

    # ========== 上传限制 ==========
    client_max_body_size 10m;

    # ========== 超时配置 ==========
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 75s;
    keepalive_requests 100;
    send_timeout 30s;

    # ==================================================================
    # 路由配置
    # ==================================================================

    # ---------- SPA History 路由（解决刷新 404） ----------
    # 优先匹配物理文件，找不到则回退到 index.html
    # 必须使用 Accept 头判断，避免资产 404 被静默吞没
    location / {
        try_files $uri $uri/ /index.html;

        # index.html 不缓存，确保新版本部署后立即生效
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # ---------- 健康检查端点 ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ==================================================================
    # 静态资源缓存策略
    # ==================================================================

    # ---------- 带哈希的 JS/CSS（1 年强缓存） ----------
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- 图片/字体（6 个月缓存） ----------
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|woff2?|ttf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, max-age=15552000" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- manifest / 其他静态文件 ----------
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ==================================================================
    # API 反向代理
    # ==================================================================

    location /api/ {
        proxy_pass http://quant-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # ==================================================================
    # WebSocket 代理
    # ==================================================================

    location /ws {
        proxy_pass http://quant-backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ==================================================================
    # 安全加固
    # ==================================================================

    # ---------- 安全响应头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- 禁止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------- 禁止访问备份文件 ----------
    location ~* \.(?:bak|backup|old|orig|save|swp|swo)$ {
        deny all;
        access_log off;
    }

    # ---------- 限制请求方法 ----------
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # ==================================================================
    # Gzip 压缩
    # ==================================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ==================================================================
    # 访问日志（非 root 用户可写）
    # ==================================================================

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
